name: Refresh official legal sources
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: official-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run laws:sync
      - run: npm run laws:audit
      - run: npm test
      - run: npm run build
      - name: Save validated source snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/corpus content/registry.json
          if ! git diff --cached --quiet; then
            git commit -m "content: refresh official PIS legal sources"
            git push
          fi
      - name: Retain reconciliation and source audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-source-audit
          path: |
            .cache/sync-report.json
            .cache/content-audit.json
          if-no-files-found: ignore
          retention-days: 30
